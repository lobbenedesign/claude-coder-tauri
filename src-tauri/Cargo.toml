[package]
name = "custom-claude-coder"
version = "2.1.0"
description = "CUSTOM CLAUDE CODER - Native Rust & Tauri Desktop App"
authors = ["Antigravity"]
edition = "2021"

[lib]
name = "custom_claude_coder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
walkdir = "2.5"
dirs = "5.0"
